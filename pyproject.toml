[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal CLI coding agent with long-term memory (pydantic-ai + Hy-Memory)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hy-memory>=1.2.17",
    "pydantic-ai>=2.43.0",
    "pydantic-ai-harness>=0.31.0",
]

[project.scripts]
personal-agent = "agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/constants"]
